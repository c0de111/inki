name: Release UF2s

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-uf2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make ninja-build gcc-arm-none-eabi binutils-arm-none-eabi python3 curl

      - name: Fetch Pico SDK
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git "$GITHUB_WORKSPACE/pico-sdk"
          cd "$GITHUB_WORKSPACE/pico-sdk"
          git submodule update --init

      - name: Build Historian UF2
        working-directory: firmware/c
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          chmod +x build.sh create_uf2.sh
          ./build.sh --historian
          ./create_uf2.sh
          ls -lh build/inki_historian.uf2

      - name: Build SeatSurfing UF2
        working-directory: firmware/c
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          ./build.sh --seatsurfing
          ./create_uf2.sh
          ls -lh build/inki_seatsurfing.uf2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uf2-artifacts
          path: |
            firmware/c/build/inki_historian.uf2
            firmware/c/build/inki_seatsurfing.uf2

  release:
    needs: build-uf2
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: uf2-artifacts
          path: uf2s

      - name: Create GitHub Release and upload UF2s
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uf2s/inki_historian.uf2
            uf2s/inki_seatsurfing.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

