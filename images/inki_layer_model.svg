<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .layer-label  { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
      .module-name  { font-size: 13px; font-weight: 600; }
      .module-detail{ font-size: 11px; fill: #444; }
      .section-title{ font-size: 11px; font-weight: 700; fill: #555; letter-spacing: 0.3px; }
      .rule-text    { font-size: 10px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#aaa"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#43a047"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="640" y="37" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">inki Firmware Layer Model</text>
  <text x="640" y="54" text-anchor="middle" font-size="13" fill="#888">Target architecture — each layer only calls the layer directly below it</text>

  <!-- ═══ LAYER 1: USE CASES  y=62, h=110, ends=172 ═══ -->
  <rect x="30" y="62" width="1200" height="110" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="50"   y="80" class="layer-label" fill="#2e7d32">Use Cases</text>
  <text x="1220" y="80" text-anchor="end" class="rule-text">(one set compiles per build via CMakeLists.txt)</text>

  <!-- seatsurfing/ -->
  <rect x="48"  y="90" width="220" height="74" rx="4" fill="#fff" stroke="#81c784" stroke-width="1"/>
  <text x="158" y="106" text-anchor="middle" class="module-name" fill="#2e7d32">seatsurfing/</text>
  <text x="58"  y="121" class="module-detail">client.c</text>
  <text x="58"  y="135" class="module-detail">epaper_pages.c</text>
  <text x="58"  y="149" class="module-detail">web_config.c  ·  config.h</text>

  <!-- historian/ -->
  <rect x="283" y="90" width="220" height="74" rx="4" fill="#fff" stroke="#81c784" stroke-width="1"/>
  <text x="393" y="106" text-anchor="middle" class="module-name" fill="#2e7d32">historian/</text>
  <text x="293" y="121" class="module-detail">client.c</text>
  <text x="293" y="135" class="module-detail">epaper_pages.c</text>
  <text x="293" y="149" class="module-detail">web_config.c  ·  config.h</text>

  <!-- homematic/ -->
  <rect x="518" y="90" width="220" height="74" rx="4" fill="#fff" stroke="#81c784" stroke-width="1"/>
  <text x="628" y="106" text-anchor="middle" class="module-name" fill="#2e7d32">homematic/</text>
  <text x="528" y="121" class="module-detail">client.c</text>
  <text x="528" y="135" class="module-detail">epaper_pages.c</text>
  <text x="528" y="149" class="module-detail">web_config.c  ·  config.h</text>

  <!-- placeholder -->
  <rect x="753" y="90" width="90" height="74" rx="4" fill="#fff" stroke="#81c784" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="798" y="126" text-anchor="middle" class="module-name" fill="#81c784">...</text>
  <text x="798" y="140" text-anchor="middle" font-size="9" fill="#81c784">+ future use cases</text>

  <!-- use_case_t badge -->
  <rect x="875" y="97" width="190" height="57" rx="4" fill="#c8e6c9" stroke="#43a047" stroke-width="1"/>
  <text x="970" y="114" text-anchor="middle" class="module-name"   fill="#2e7d32">use_case_t</text>
  <text x="970" y="128" text-anchor="middle" class="module-detail">single API contract</text>
  <text x="970" y="142" text-anchor="middle" class="module-detail">to layers below</text>
  <!-- contract flows downward -->
  <line x1="970" y1="155" x2="970" y2="175" stroke="#43a047" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowhead-green)"/>

  <!-- Arrow -->
  <line x1="640" y1="172" x2="640" y2="182" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══ LAYER 2: SHARED CONTENT  y=182, h=126, ends=308 ═══ -->
  <!-- 3 equal boxes: w=380, gap=12; x: 48, 440, 832  (right edge 1212) -->
  <rect x="30"   y="182" width="1200" height="126" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="50"   y="198" class="layer-label" fill="#1565c0">Shared Content</text>
  <text x="1220" y="198" text-anchor="end" class="rule-text">(always compiled)</text>

  <!-- EPAPER -->
  <rect x="48"  y="206" width="380" height="94" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="58"  y="222" class="section-title">EPAPER</text>
  <text x="120" y="222" class="module-name" fill="#1565c0">epaper_pages_shared.c</text>
  <text x="58"  y="236" class="module-detail">battery icon, logo</text>
  <text x="58"  y="249" class="module-detail">WiFi setup screen</text>
  <text x="58"  y="262" class="module-detail">decision maker</text>
  <text x="58"  y="275" class="module-detail">parameter / info page</text>

  <!-- TELEMETRY -->
  <rect x="440" y="206" width="380" height="94" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="450" y="222" class="section-title">TELEMETRY</text>
  <text x="532" y="222" class="module-name" fill="#1565c0">inki_monitor.c</text>
  <text x="450" y="236" class="module-detail">cross-cutting: collects from</text>
  <text x="450" y="249" class="module-detail">power, wifi, rtc, nfc</text>
  <text x="450" y="262" class="module-detail">sends via http_client.c</text>
  <text x="450" y="275" class="module-detail">no use_case.name needed</text>

  <!-- WEB -->
  <rect x="832" y="206" width="380" height="94" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="842" y="222" class="section-title">WEB</text>
  <text x="875" y="222" class="module-name" fill="#1565c0">web/</text>
  <text x="842" y="236" class="module-detail">landing, device config, OTA, device status</text>
  <text x="842" y="249" class="module-detail">settings import/export, clock, logo, NFC</text>
  <text x="842" y="262" class="module-detail">captive portal, hardware info</text>
  <text x="842" y="278" class="module-detail" font-style="italic" fill="#888">page handlers → HTML only, no tcp_pcb</text>

  <!-- Arrow -->
  <line x1="640" y1="308" x2="640" y2="318" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══ LAYER 3: SERVICES  y=318, h=170, ends=488 ═══ -->
  <!-- 6 uniform boxes: w=184, gap=12; x: 48, 244, 440, 636, 832, 1028  (right edge 1212) -->
  <rect x="30"   y="318" width="1200" height="170" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="50"   y="336" class="layer-label" fill="#e65100">Services</text>
  <text x="1220" y="336" text-anchor="end" class="rule-text">(one layer — both groups wrap drivers/SDK directly)</text>

  <text x="50" y="350" class="section-title" fill="#e65100">DOMAIN</text>

  <!-- Domain boxes  y=356, h=42, ends=398 -->
  <rect x="48"   y="356" width="184" height="42" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="140"  y="372" text-anchor="middle" class="module-name"   fill="#e65100">epaper_render.c</text>
  <text x="140"  y="386" text-anchor="middle" class="module-detail">draw helpers, layout by caps</text>

  <rect x="244"  y="356" width="184" height="42" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="336"  y="372" text-anchor="middle" class="module-name"   fill="#e65100">rtc.c</text>
  <text x="336"  y="386" text-anchor="middle" class="module-detail">backend select, autoset</text>

  <rect x="440"  y="356" width="184" height="42" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="532"  y="372" text-anchor="middle" class="module-name"   fill="#e65100">power.c</text>
  <text x="532"  y="386" text-anchor="middle" class="module-detail">hold, shutdown, off</text>

  <rect x="636"  y="356" width="184" height="42" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="728"  y="372" text-anchor="middle" class="module-name"   fill="#e65100">boot_input.c</text>
  <text x="728"  y="386" text-anchor="middle" class="module-detail">wake source, buttons, NFC</text>

  <rect x="832"  y="356" width="184" height="42" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="924"  y="372" text-anchor="middle" class="module-name"   fill="#e65100">sensors.c</text>
  <text x="924"  y="386" text-anchor="middle" class="module-detail">battery, temp, strap</text>

  <rect x="1028" y="356" width="184" height="42" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="1120" y="372" text-anchor="middle" class="module-name"   fill="#e65100">i2c_bus.c</text>
  <text x="1120" y="386" text-anchor="middle" class="module-detail">I2C bus, HW detect</text>

  <text x="50" y="410" class="section-title" fill="#e65100">INFRASTRUCTURE</text>

  <!-- Infra boxes  y=416, h=58, ends=474 -->
  <rect x="48"   y="416" width="184" height="58" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="140"  y="432" text-anchor="middle" class="module-name"   fill="#e65100">epaper.c</text>
  <text x="140"  y="446" text-anchor="middle" class="module-detail">init, caps, buffer</text>
  <text x="140"  y="459" text-anchor="middle" class="module-detail">display, sleep</text>

  <rect x="244"  y="416" width="184" height="58" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="336"  y="432" text-anchor="middle" class="module-name"   fill="#e65100">flash.c</text>
  <text x="336"  y="446" text-anchor="middle" class="module-detail">generic load/save</text>
  <text x="336"  y="459" text-anchor="middle" class="module-detail">OTA stream API, logo</text>

  <rect x="440"  y="416" width="184" height="58" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="532"  y="432" text-anchor="middle" class="module-name"   fill="#e65100">http_client.c</text>
  <text x="532"  y="446" text-anchor="middle" class="module-detail">http_parse.c</text>
  <text x="532"  y="459" text-anchor="middle" class="module-detail">request/response, TLS</text>

  <rect x="636"  y="416" width="184" height="58" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="728"  y="432" text-anchor="middle" class="module-name"   fill="#e65100">tls_trust_store.c</text>
  <text x="728"  y="446" text-anchor="middle" class="module-detail">ALTCP TLS config</text>
  <text x="728"  y="459" text-anchor="middle" class="module-detail">cert chain (HARICA)</text>

  <rect x="832"  y="416" width="184" height="58" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="924"  y="432" text-anchor="middle" class="module-name"   fill="#e65100">webserver.c</text>
  <text x="924"  y="446" text-anchor="middle" class="module-detail">routing, scaffold</text>
  <text x="924"  y="459" text-anchor="middle" class="module-detail">owns tcp_pcb, dispatch</text>

  <rect x="1028" y="416" width="184" height="58" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="1120" y="432" text-anchor="middle" class="module-name"   fill="#e65100">wifi.c</text>
  <text x="1120" y="446" text-anchor="middle" class="module-detail">connect, AP, DHCP</text>
  <text x="1120" y="459" text-anchor="middle" class="module-detail">MAC, RSSI (wraps cyw43)</text>

  <!-- Arrow -->
  <line x1="640" y1="488" x2="640" y2="498" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══ LAYER 4: DRIVERS  y=498, h=58, ends=556 ═══ -->
  <!-- 5 uniform boxes: w=223, gap=12; x: 48, 283, 518, 753, 988  (right edge 1211) -->
  <rect x="30"  y="498" width="1200" height="58" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="50"  y="516" class="layer-label" fill="#c62828">Drivers</text>

  <rect x="48"  y="524" width="223" height="28" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="159" y="542" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">EPD_4in2.c, EPD_7in5.c, Paint, SPI</text>

  <rect x="283" y="524" width="223" height="28" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="394" y="542" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">ds3231.c</text>

  <rect x="518" y="524" width="223" height="28" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="629" y="542" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">rv3028.c</text>

  <rect x="753" y="524" width="223" height="28" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="864" y="542" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">st25_io.c</text>

  <rect x="988" y="524" width="223" height="28" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="1099" y="542" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">CYW43 (cyw43_arch, lwIP)</text>

  <!-- Arrow -->
  <line x1="640" y1="556" x2="640" y2="566" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══ LAYER 5: SDK  y=566, h=36, ends=602 ═══ -->
  <rect x="30"  y="566" width="1200" height="36" rx="6" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
  <text x="50"  y="588" class="layer-label" fill="#37474f">SDK</text>
  <text x="170" y="588" font-size="12" fill="#546e7f">Pico SDK 2.1.0  /  I2C, SPI, ADC, GPIO  /  cyw43_arch  /  lwIP  /  mbedTLS</text>

  <!-- Arrow -->
  <line x1="640" y1="602" x2="640" y2="612" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══ HARDWARE  y=612, h=36, ends=648 ═══ -->
  <rect x="30"  y="612" width="1200" height="36" rx="6" fill="#efebe9" stroke="#795548" stroke-width="1.5"/>
  <text x="50"  y="634" class="layer-label" fill="#4e342e">Hardware</text>
  <text x="175" y="634" font-size="12" fill="#6d4c41">RP2040 + CYW43  /  ePaper SPI  /  I2C bus (RTC, NFC, BMP581)  /  ADC (battery, coin cell, temp)  /  GPIO (buttons)</text>

  <!-- ═══ EXTERNAL  y=658, h=34, ends=692 ═══ -->
  <rect x="30"  y="658" width="1200" height="34" rx="6" fill="#fff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="50"  y="678" class="layer-label" fill="#9e9e9e">External</text>
  <text x="175" y="678" font-size="12" fill="#9e9e9e">inki-monitor (telemetry server)  /  inki-seatsurfing-relay  /  SeatSurfing API  /  Historian API  /  Homematic CCU  /  WMS tiles</text>

  <!-- Timestamp -->
  <text x="1245" y="714" text-anchor="end" font-size="9" fill="#ccc">updated 2026-04-25</text>

  <!-- ═══ SIDE ANNOTATION: main.c orchestrator  spans L1–L3 ═══ -->
  <path d="M 1234 62 L 1244 62 L 1244 488 L 1234 488" fill="none" stroke="#666" stroke-width="1.2"/>
  <text x="1260" y="275" class="module-detail" fill="#666" transform="rotate(90, 1260, 275)" text-anchor="middle" font-size="11" font-weight="600">main.c orchestrator (~140 lines)</text>

</svg>
