title: inki
description: Wireless information displays for modern spaces
theme: jekyll-theme-minimal
show_downloads: false
url: "https://c0de111.github.io"
baseurl: "/inki" # overridden to "" by docs/_plugins/dev_baseurl.rb during local `jekyll serve`
logo: /assets/images/inki_octopus.png
github:
  is_project_page: true
  repository_url: https://github.com/c0de111/inki

# Language configuration
lang: en-US
languages: ["en", "de"]

# Multilingual descriptions
description_en: "Wireless information displays for modern spaces"
description_de: "Drahtlose Informationsanzeigen für moderne Räume"

# Default collections and paths
collections:
  posts:
    output: true

# Set permalink structure
permalink: pretty

# Enable plugins for SEO
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
