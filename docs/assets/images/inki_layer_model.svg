<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .layer-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
      .module-name { font-size: 11px; font-weight: 600; }
      .module-detail { font-size: 9.5px; fill: #444; }
      .section-title { font-size: 10px; font-weight: 700; fill: #555; letter-spacing: 0.3px; }
      .rule-text { font-size: 9.5px; fill: #666; }
      .arrow-label { font-size: 9px; fill: #888; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="820" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">inki Firmware Layer Model</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#888">Target architecture — each layer only calls the layer directly below it</text>

  <!-- ═══════════════════ LAYER 1: USE CASES ═══════════════════ -->
  <rect x="30" y="68" width="840" height="110" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="50" y="86" class="layer-label" fill="#2e7d32">Use Cases</text>
  <text x="845" y="86" text-anchor="end" class="rule-text">(one set compiles per build via CMakeLists.txt)</text>

  <!-- Use case boxes -->
  <rect x="50" y="96" width="170" height="70" rx="4" fill="#fff" stroke="#81c784" stroke-width="1"/>
  <text x="135" y="112" text-anchor="middle" class="module-name" fill="#2e7d32">seatsurfing/</text>
  <text x="60" y="126" class="module-detail">client.c</text>
  <text x="60" y="138" class="module-detail">epaper_pages.c</text>
  <text x="60" y="150" class="module-detail">web_config.c</text>
  <text x="60" y="162" class="module-detail">config.h</text>

  <rect x="240" y="96" width="170" height="70" rx="4" fill="#fff" stroke="#81c784" stroke-width="1"/>
  <text x="325" y="112" text-anchor="middle" class="module-name" fill="#2e7d32">historian/</text>
  <text x="250" y="126" class="module-detail">client.c</text>
  <text x="250" y="138" class="module-detail">epaper_pages.c</text>
  <text x="250" y="150" class="module-detail">web_config.c</text>
  <text x="250" y="162" class="module-detail">config.h</text>

  <rect x="430" y="96" width="170" height="70" rx="4" fill="#fff" stroke="#81c784" stroke-width="1"/>
  <text x="515" y="112" text-anchor="middle" class="module-name" fill="#2e7d32">homematic/</text>
  <text x="440" y="126" class="module-detail">client.c</text>
  <text x="440" y="138" class="module-detail">epaper_pages.c</text>
  <text x="440" y="150" class="module-detail">web_config.c</text>
  <text x="440" y="162" class="module-detail">config.h</text>

  <rect x="620" y="96" width="100" height="70" rx="4" fill="#fff" stroke="#81c784" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="670" y="136" text-anchor="middle" class="module-name" fill="#81c784">...</text>

  <!-- use_case_t badge -->
  <rect x="735" y="104" width="120" height="52" rx="4" fill="#c8e6c9" stroke="#43a047" stroke-width="1"/>
  <text x="795" y="122" text-anchor="middle" class="module-name" fill="#2e7d32">use_case_t</text>
  <text x="795" y="136" text-anchor="middle" class="module-detail">single API contract</text>
  <text x="795" y="148" text-anchor="middle" class="module-detail">to layers below</text>

  <!-- ═══════════════════ ARROW ═══════════════════ -->
  <line x1="450" y1="178" x2="450" y2="196" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#aaa"/></marker></defs>

  <!-- ═══════════════════ LAYER 2: SHARED CONTENT ═══════════════════ -->
  <rect x="30" y="198" width="840" height="155" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="50" y="216" class="layer-label" fill="#1565c0">Shared Content</text>
  <text x="845" y="216" text-anchor="end" class="rule-text">(always compiled, zero #ifdefs)</text>

  <!-- ePaper shared -->
  <rect x="50" y="226" width="200" height="82" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="60" y="242" class="section-title">EPAPER</text>
  <text x="60" y="242" class="module-name" fill="#1565c0" dx="50">epaper_pages_shared.c</text>
  <text x="60" y="258" class="module-detail">battery icon, logo</text>
  <text x="60" y="270" class="module-detail">WiFi setup screen</text>
  <text x="60" y="282" class="module-detail">decision maker</text>
  <text x="60" y="294" class="module-detail">parameter / info page</text>

  <!-- Telemetry -->
  <rect x="265" y="226" width="195" height="82" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="275" y="242" class="section-title">TELEMETRY</text>
  <text x="275" y="242" class="module-name" fill="#1565c0" dx="76">inki_monitor.c</text>
  <text x="275" y="258" class="module-detail">cross-cutting: collects from</text>
  <text x="275" y="270" class="module-detail">power, wifi, rtc, nfc</text>
  <text x="275" y="282" class="module-detail">sends via http.c</text>
  <text x="275" y="294" class="module-detail">no use_case.name needed</text>

  <!-- Web shared -->
  <rect x="475" y="226" width="380" height="118" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="485" y="242" class="section-title">WEB</text>
  <text x="510" y="242" class="module-name" fill="#1565c0">web_pages_shared.c</text>
  <text x="485" y="258" class="module-detail">landing page (use case link from registered info)</text>
  <text x="485" y="270" class="module-detail">device config: name, ePaper type, refresh intervals</text>
  <text x="485" y="282" class="module-detail">(labels from use_case.page_labels[]), WiFi, telemetry,</text>
  <text x="485" y="294" class="module-detail">hardware, clock, logo, NFC (runtime I2C detect)</text>
  <text x="485" y="310" class="module-detail">OTA / firmware update, device status</text>
  <text x="485" y="322" class="module-detail">settings import/export, message page</text>
  <text x="485" y="338" class="module-detail" font-style="italic" fill="#888">page handlers produce HTML, no tcp_pcb dependency</text>

  <!-- ═══════════════════ ARROW ═══════════════════ -->
  <line x1="450" y1="353" x2="450" y2="371" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════ LAYER 3: SERVICES (merged) ═══════════════════ -->
  <rect x="30" y="373" width="840" height="165" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="50" y="391" class="layer-label" fill="#e65100">Services</text>
  <text x="845" y="391" text-anchor="end" class="rule-text">(one layer — both groups wrap drivers/SDK directly)</text>

  <!-- Domain group label -->
  <text x="50" y="410" class="section-title" fill="#e65100">DOMAIN</text>

  <rect x="50" y="418" width="155" height="38" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="127" y="434" text-anchor="middle" class="module-name" fill="#e65100">epaper_render.c</text>
  <text x="127" y="448" text-anchor="middle" class="module-detail">draw helpers, layout by caps</text>

  <rect x="215" y="418" width="120" height="38" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="275" y="434" text-anchor="middle" class="module-name" fill="#e65100">rtc.c</text>
  <text x="275" y="448" text-anchor="middle" class="module-detail">backend select, autoset</text>

  <rect x="345" y="418" width="120" height="38" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="405" y="434" text-anchor="middle" class="module-name" fill="#e65100">power.c</text>
  <text x="405" y="448" text-anchor="middle" class="module-detail">hold, shutdown, power off</text>

  <!-- Infrastructure group label -->
  <text x="50" y="476" class="section-title" fill="#e65100">INFRASTRUCTURE</text>

  <rect x="50" y="484" width="120" height="44" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="110" y="500" text-anchor="middle" class="module-name" fill="#e65100">epaper.c</text>
  <text x="110" y="514" text-anchor="middle" class="module-detail">init, caps, buffer</text>
  <text x="110" y="524" text-anchor="middle" class="module-detail">display, sleep</text>

  <rect x="180" y="484" width="140" height="44" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="250" y="500" text-anchor="middle" class="module-name" fill="#e65100">flash.c</text>
  <text x="250" y="514" text-anchor="middle" class="module-detail">generic load/save</text>
  <text x="250" y="524" text-anchor="middle" class="module-detail">OTA stream API, logo</text>

  <rect x="330" y="484" width="110" height="44" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="385" y="500" text-anchor="middle" class="module-name" fill="#e65100">http_client.c</text>
  <text x="385" y="514" text-anchor="middle" class="module-detail">request / response</text>
  <text x="385" y="524" text-anchor="middle" class="module-detail">TLS support</text>

  <!-- Domain continued (right side) -->
  <rect x="480" y="418" width="130" height="38" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="545" y="434" text-anchor="middle" class="module-name" fill="#e65100">boot_input.c</text>
  <text x="545" y="448" text-anchor="middle" class="module-detail">wake source, buttons, NFC</text>

  <rect x="620" y="418" width="120" height="38" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="680" y="434" text-anchor="middle" class="module-name" fill="#e65100">sensors.c</text>
  <text x="680" y="448" text-anchor="middle" class="module-detail">battery, temp, strap</text>

  <rect x="750" y="418" width="110" height="38" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="805" y="434" text-anchor="middle" class="module-name" fill="#e65100">i2c_probe.c</text>
  <text x="805" y="448" text-anchor="middle" class="module-detail">runtime HW detect</text>

  <!-- Infrastructure continued (right side) -->
  <rect x="450" y="484" width="145" height="44" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="522" y="500" text-anchor="middle" class="module-name" fill="#e65100">webserver.c</text>
  <text x="522" y="514" text-anchor="middle" class="module-detail">routing, scaffold</text>
  <text x="522" y="524" text-anchor="middle" class="module-detail">owns tcp_pcb, dispatch</text>

  <rect x="605" y="484" width="145" height="44" rx="4" fill="#fff" stroke="#ffcc80" stroke-width="1"/>
  <text x="677" y="500" text-anchor="middle" class="module-name" fill="#e65100">wifi.c</text>
  <text x="677" y="514" text-anchor="middle" class="module-detail">connect, AP, DHCP</text>
  <text x="677" y="524" text-anchor="middle" class="module-detail">MAC, RSSI (wraps cyw43)</text>

  <!-- ═══════════════════ ARROW ═══════════════════ -->
  <line x1="450" y1="538" x2="450" y2="556" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════ LAYER 4: DRIVERS ═══════════════════ -->
  <rect x="30" y="558" width="840" height="55" rx="6" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="50" y="576" class="layer-label" fill="#c62828">Drivers</text>

  <rect x="50" y="583" width="250" height="22" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="175" y="598" text-anchor="middle" class="module-name" fill="#c62828" font-size="10">EPD_4in2.c, EPD_7in5.c, Paint, SPI</text>

  <rect x="315" y="583" width="100" height="22" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="365" y="598" text-anchor="middle" class="module-name" fill="#c62828" font-size="10">ds3231.c</text>

  <rect x="430" y="583" width="100" height="22" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="480" y="598" text-anchor="middle" class="module-name" fill="#c62828" font-size="10">rv3028.c</text>

  <rect x="545" y="583" width="100" height="22" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="595" y="598" text-anchor="middle" class="module-name" fill="#c62828" font-size="10">st25_io.c</text>

  <rect x="660" y="583" width="195" height="22" rx="3" fill="#fff" stroke="#ef9a9a" stroke-width="1"/>
  <text x="757" y="598" text-anchor="middle" class="module-name" fill="#c62828" font-size="10">CYW43 (cyw43_arch, lwIP)</text>

  <!-- ═══════════════════ ARROW ═══════════════════ -->
  <line x1="450" y1="613" x2="450" y2="631" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════ LAYER 5: SDK ═══════════════════ -->
  <rect x="30" y="633" width="840" height="40" rx="6" fill="#eceff1" stroke="#78909c" stroke-width="1.5"/>
  <text x="50" y="658" class="layer-label" fill="#37474f">SDK</text>
  <text x="180" y="658" class="module-detail" font-size="11" fill="#546e7f">Pico SDK 2.1.0  /  I2C, SPI, ADC, GPIO  /  cyw43_arch  /  lwIP  /  mbedTLS</text>

  <!-- Arrow: SDK → hardware -->
  <line x1="450" y1="673" x2="450" y2="691" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════ HARDWARE ═══════════════════ -->
  <rect x="30" y="693" width="840" height="40" rx="6" fill="#efebe9" stroke="#795548" stroke-width="1.5"/>
  <text x="50" y="718" class="layer-label" fill="#4e342e">Hardware</text>
  <text x="180" y="718" class="module-detail" font-size="11" fill="#6d4c41">RP2040 + CYW43  /  ePaper SPI  /  I2C bus (RTC, NFC, BMP581)  /  ADC (battery, coin cell, temp)  /  GPIO (buttons)</text>

  <!-- ═══════════════════ EXTERNAL SERVICES (outside model) ═══════════════════ -->
  <rect x="30" y="750" width="840" height="35" rx="6" fill="#fff" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="50" y="772" class="layer-label" fill="#9e9e9e">External</text>
  <text x="180" y="772" class="module-detail" font-size="11" fill="#9e9e9e">inki-monitor (telemetry server)  /  inki-seatsurfing-relay  /  SeatSurfing API  /  Historian API  /  Homematic CCU  /  WMS tiles</text>

  <!-- ═══════════════════ SIDE ANNOTATION: main.c orchestrator ═══════════════════ -->
  <path d="M 878 75 L 888 75 L 888 530 L 878 530" fill="none" stroke="#666" stroke-width="1.2"/>
  <text x="893" y="305" class="module-detail" fill="#666" transform="rotate(90, 893, 305)" text-anchor="middle" font-size="11" font-weight="600">main.c orchestrator (~150 lines)</text>

</svg>
